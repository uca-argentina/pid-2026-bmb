<div
  class="flex items-center justify-between gap-4 border-t border-borde-sutil px-5 py-[15px]
         transition-colors duration-160 ease-out hover:bg-lienzo lg:px-6"
>
  <div class="min-w-0">
    <p class="num-tabular truncate text-[13.5px] font-semibold text-tinta">{{ titulo() }}</p>
    <p class="num-tabular mt-0.5 text-[12px] text-plomo">
      @if (vista() === 'CONDUCTOR') {
        {{ fecha() | date: 'EEE d MMM' }} ·
      }
      {{ reserva().horaDesde }} – {{ reserva().horaHasta }}
    </p>
  </div>

  <div class="flex shrink-0 items-center gap-2">
    <ui-etiqueta [tono]="tonoEstado()">{{ etiquetaEstado[reserva().estado] }}</ui-etiqueta>
    @if (permiteCancelar() && activa()) {
      <ui-boton variante="peligro" tamano="sm" (presionado)="cancelar.emit(reserva())">
        Cancelar
      </ui-boton>
    }
  </div>
</div>
