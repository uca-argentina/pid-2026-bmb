<div class="grid grid-cols-2 gap-2.5 lg:grid-cols-4" role="radiogroup" aria-label="Franja horaria">
  @for (franja of franjas(); track franja.horaDesde) {
    <button
      type="button"
      class="franja"
      role="radio"
      [class.franja--activa]="esActiva(franja)"
      [disabled]="!franja.disponible"
      [attr.aria-checked]="esActiva(franja)"
      [attr.title]="franja.disponible ? null : 'Sin cocheras libres en esta franja'"
      (click)="rangoElegido.emit({ horaDesde: franja.horaDesde, horaHasta: franja.horaHasta })"
    >
      <span class="num-tabular">{{ franja.horaDesde }} – {{ franja.horaHasta }}</span>
    </button>
  }
</div>
