<div class="flex min-h-dvh bg-lienzo">
  <!-- Desktop: nav lateral fija -->
  <div class="sticky top-0 hidden h-dvh lg:block">
    <app-barra-lateral
      [items]="items()"
      [usuario]="usuario()"
      [rolAlternativo]="rolAlternativo()"
      [cambiandoRol]="cambiandoRol()"
      (salir)="salir()"
      (cambiarRol)="cambiarRol()"
    />
  </div>

  <div class="flex min-w-0 flex-1 flex-col">
    <!-- Mobile: marca + salida, ocupa el lugar de la status bar del prototipo -->
    <div
      class="sticky top-0 z-10 flex items-center justify-between border-b border-borde-sutil
             bg-lienzo/85 px-6 py-3 backdrop-blur-md lg:hidden"
    >
      <ui-logo [tamano]="24" />
      <span class="flex items-center gap-1">
        @if (rolAlternativo()) {
          <button
            type="button"
            class="rounded-boton px-2 py-1 text-[12px] font-medium text-acento-fuerte transition-colors
                   duration-160 ease-out hover:bg-acento-suave disabled:opacity-60"
            [disabled]="cambiandoRol()"
            (click)="cambiarRol()"
          >
            Perfil {{ etiquetaRolAlternativo() }}
          </button>
        }
        <button
          type="button"
          class="rounded-boton px-2 py-1 text-[12px] font-medium text-plomo transition-colors
                 duration-160 ease-out hover:bg-borde-sutil hover:text-tinta"
          (click)="salir()"
        >
          Salir
        </button>
      </span>
    </div>

    <main class="flex-1">
      <router-outlet />
    </main>

    <div class="sticky bottom-0 z-10 lg:hidden">
      <app-tabs-inferior [items]="items()" />
    </div>
  </div>
</div>
