<div class="flex min-h-dvh flex-col justify-between bg-lienzo px-6 py-10">
  <div class="mx-auto w-full max-w-[380px]">
    <header class="mb-9">
      <p class="text-[16px] font-semibold text-tinta">UCAio</p>
      <p class="mt-0.5 text-[11.5px] text-humo">Gestión de estacionamientos</p>

      <h1 class="titulo-vista mt-8">Ingresar</h1>
      <p class="mt-1.5 text-[13.5px] text-plomo">
        Reserva tu cochera o gestiona la ocupación de tu estacionamiento.
      </p>
    </header>

    <form class="flex flex-col gap-4" [formGroup]="formulario" (ngSubmit)="enviar()">
      <label class="campo">
        <span class="label-campo">Email</span>
        <input type="email" formControlName="email" autocomplete="email" placeholder="tu@email.com" />
      </label>

      <label class="campo">
        <span class="label-campo">Contraseña</span>
        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="••••••••"
        />
      </label>

      @if (error(); as mensaje) {
        <p
          class="rounded-control border border-ocupada/30 bg-papel px-4 py-3 text-[13px] text-ocupada"
          role="alert"
        >
          {{ mensaje }}
        </p>
      }

      <ui-boton class="mt-1" variante="primario" tipo="submit" [bloque]="true" [cargando]="enviando()">
        Ingresar
      </ui-boton>
    </form>
  </div>

  <div class="mx-auto mt-10 w-full max-w-[380px]">
    <p class="eyebrow mb-3 text-center">Accesos de prueba</p>
    <div class="flex flex-col gap-2">
      @for (demo of demos; track demo.rol) {
        <ui-boton [bloque]="true" [deshabilitado]="enviando()" (presionado)="ingresarComo(demo.email)">
          {{ demo.etiqueta }}
        </ui-boton>
      }
    </div>
  </div>
</div>
