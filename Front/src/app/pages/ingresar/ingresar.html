<div class="relative flex min-h-dvh items-center justify-center overflow-hidden bg-lienzo px-6 py-12">
  <!-- Halo del acento detras de la tarjeta: la unica pieza decorativa de la app -->
  <div
    class="pointer-events-none absolute -top-40 left-1/2 h-[420px] w-[620px] -translate-x-1/2
           rounded-full bg-acento/8 blur-3xl"
    aria-hidden="true"
  ></div>

  <div class="relative w-full max-w-[400px]">
    <header class="mb-7 flex flex-col items-center text-center">
      <span class="marca-logo !h-11 !w-11 !rounded-[12px] !text-[18px]" aria-hidden="true">U</span>
      <h1 class="titulo-vista mt-5">Ingresar a UCAio</h1>
      <p class="mt-2 max-w-[320px] text-[13.5px] leading-relaxed text-plomo">
        Reservá tu cochera o gestioná la ocupación de tu estacionamiento.
      </p>
    </header>

    <div class="rounded-tarjeta border border-borde bg-papel p-6 shadow-flotante lg:p-7">
      <form class="flex flex-col gap-4" [formGroup]="formulario" (ngSubmit)="enviar()">
        <label class="campo">
          <span class="label-campo">Email</span>
          <input
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="tu@email.com"
          />
        </label>

        <label class="campo">
          <span class="label-campo">Contraseña</span>
          <input
            type="password"
            formControlName="password"
            autocomplete="current-password"
            placeholder="••••••••"
          />
        </label>

        @if (error(); as mensaje) {
          <p
            class="rounded-control border border-ocupada/25 bg-ocupada/5 px-4 py-3 text-[13px]
                   text-ocupada"
            role="alert"
          >
            {{ mensaje }}
          </p>
        }

        <ui-boton
          class="mt-1"
          variante="primario"
          tipo="submit"
          [bloque]="true"
          [cargando]="enviando()"
        >
          Ingresar
        </ui-boton>
      </form>

      <div class="mt-6 flex items-center gap-3" aria-hidden="true">
        <span class="h-px flex-1 bg-borde-sutil"></span>
        <span class="eyebrow eyebrow-neutro">Accesos de prueba</span>
        <span class="h-px flex-1 bg-borde-sutil"></span>
      </div>

      <div class="mt-4 flex flex-col gap-2">
        @for (demo of demos; track demo.rol) {
          <ui-boton
            [bloque]="true"
            [deshabilitado]="enviando()"
            (presionado)="ingresarComo(demo.email)"
          >
            {{ demo.etiqueta }}
          </ui-boton>
        }
      </div>
    </div>
  </div>
</div>
